[project]
name = "ams-ecal-qml"
version = "0.1.0"
description = "Physics-informed simulation and QML classification of AMS-02 ECAL events."
requires-python = ">=3.14,<3.15"
dependencies = [
    "pyyaml>=6.0.3,<7",
]

[dependency-groups]
dev = [
    "ipykernel",
    "jupyterlab",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ams_ecal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--basetemp=.pytest_tmp"
